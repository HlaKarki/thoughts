name: Thoughts
options:
  bundleIdPrefix: dev.hla
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  configs:
    Debug:
      THOUGHTS_BUNDLE_ID: dev.hla.thoughts.debug
      THOUGHTS_DISPLAY_NAME: Thoughts Dev
      THOUGHTS_APP_GROUP: $(TeamIdentifierPrefix)dev.hla.thoughts.debug
      THOUGHTS_URL_SCHEME: thoughts-dev
    Release:
      THOUGHTS_BUNDLE_ID: dev.hla.thoughts
      THOUGHTS_DISPLAY_NAME: Thoughts
      THOUGHTS_APP_GROUP: $(TeamIdentifierPrefix)dev.hla.thoughts
      THOUGHTS_URL_SCHEME: thoughts
packages:
  ThoughtsCore:
    path: Packages/ThoughtsCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    minorVersion: 3.1.0
targets:
  Thoughts:
    type: application
    platform: macOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(THOUGHTS_DISPLAY_NAME)
        CFBundleDisplayName: $(THOUGHTS_DISPLAY_NAME)
        LSMinimumSystemVersion: "15.4"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(THOUGHTS_URL_SCHEME)
        ThoughtsAppGroup: $(THOUGHTS_APP_GROUP)
    entitlements:
      path: Config/Thoughts.entitlements
      properties:
        com.apple.security.application-groups:
          - $(THOUGHTS_APP_GROUP)
    settings:
      base:
        PRODUCT_NAME: Thoughts
        PRODUCT_MODULE_NAME: Thoughts
        PRODUCT_BUNDLE_IDENTIFIER: $(THOUGHTS_BUNDLE_ID)
    dependencies:
      - package: ThoughtsCore
        product: ThoughtsCore
      - package: KeyboardShortcuts
      - target: ThoughtsCLI
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: ThoughtsShare
  ThoughtsShare:
    type: app-extension
    platform: macOS
    sources:
      - ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleName: $(THOUGHTS_DISPLAY_NAME) Share
        CFBundleDisplayName: Add to $(THOUGHTS_DISPLAY_NAME)
        LSMinimumSystemVersion: "15.4"
        ThoughtsAppGroup: $(THOUGHTS_APP_GROUP)
        ThoughtsURLScheme: $(THOUGHTS_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    entitlements:
      path: ShareExtension/ThoughtsShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(THOUGHTS_APP_GROUP)
    settings:
      base:
        PRODUCT_NAME: ThoughtsShare
        PRODUCT_MODULE_NAME: ThoughtsShare
        PRODUCT_BUNDLE_IDENTIFIER: $(THOUGHTS_BUNDLE_ID).share
    dependencies:
      - package: ThoughtsCore
        product: ThoughtsCore
  ThoughtsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ThoughtsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hla.thoughts.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Thoughts
  ThoughtsCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
    settings:
      base:
        PRODUCT_NAME: thoughts
        PRODUCT_MODULE_NAME: ThoughtsCLI
    dependencies:
      - package: ThoughtsCore
        product: ThoughtsCommands
schemes:
  Thoughts:
    build:
      targets:
        Thoughts: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThoughtsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
