name: Thoughts
options:
  bundleIdPrefix: dev.hla
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  ThoughtsCore:
    path: Packages/ThoughtsCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    minorVersion: 3.1.0
targets:
  Thoughts:
    type: application
    platform: macOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(THOUGHTS_DISPLAY_NAME)
        CFBundleDisplayName: $(THOUGHTS_DISPLAY_NAME)
        LSMinimumSystemVersion: "15.4"
        LSUIElement: true
    settings:
      base:
        PRODUCT_NAME: Thoughts
        PRODUCT_MODULE_NAME: Thoughts
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.hla.thoughts.debug
          THOUGHTS_DISPLAY_NAME: Thoughts Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.hla.thoughts
          THOUGHTS_DISPLAY_NAME: Thoughts
    dependencies:
      - package: ThoughtsCore
        product: ThoughtsCore
      - package: KeyboardShortcuts
      - target: ThoughtsCLI
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  ThoughtsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ThoughtsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hla.thoughts.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Thoughts
  ThoughtsCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
    settings:
      base:
        PRODUCT_NAME: thoughts
        PRODUCT_MODULE_NAME: ThoughtsCLI
    dependencies:
      - package: ThoughtsCore
        product: ThoughtsCommands
schemes:
  Thoughts:
    build:
      targets:
        Thoughts: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThoughtsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
