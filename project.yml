name: Thoughts
options:
  bundleIdPrefix: dev.hla
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      THOUGHTS_BUNDLE_ID: dev.hla.thoughts.debug
      THOUGHTS_DISPLAY_NAME: Thoughts Dev
      THOUGHTS_APP_GROUP: $(TeamIdentifierPrefix)dev.hla.thoughts.debug
      THOUGHTS_URL_SCHEME: thoughts-dev
      THOUGHTS_AUTOMATIC_UPDATE_CHECKS: NO
    Release:
      THOUGHTS_BUNDLE_ID: dev.hla.thoughts
      THOUGHTS_DISPLAY_NAME: Thoughts
      THOUGHTS_APP_GROUP: $(TeamIdentifierPrefix)dev.hla.thoughts
      THOUGHTS_URL_SCHEME: thoughts
      THOUGHTS_AUTOMATIC_UPDATE_CHECKS: YES
packages:
  ThoughtsCore:
    path: Packages/ThoughtsCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    minorVersion: 3.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Thoughts:
    type: application
    platform: macOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(THOUGHTS_DISPLAY_NAME)
        CFBundleDisplayName: $(THOUGHTS_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.4"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(THOUGHTS_URL_SCHEME)
        ThoughtsAppGroup: $(THOUGHTS_APP_GROUP)
        SUFeedURL: https://github.com/HlaKarki/thoughts/releases/latest/download/appcast.xml
        SUPublicEDKey: 0hBOwDutzPP3kabws9Vn3HIfHAyG3dOsH0IQgzBSiGY=
        SUEnableAutomaticChecks: $(THOUGHTS_AUTOMATIC_UPDATE_CHECKS)
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Config/Thoughts.entitlements
      properties:
        com.apple.security.application-groups:
          - $(THOUGHTS_APP_GROUP)
    settings:
      base:
        PRODUCT_NAME: Thoughts
        PRODUCT_MODULE_NAME: Thoughts
        PRODUCT_BUNDLE_IDENTIFIER: $(THOUGHTS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ThoughtsCore
        product: ThoughtsCore
      - package: KeyboardShortcuts
      - package: Sparkle
      - target: ThoughtsCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: ThoughtsShare
  ThoughtsShare:
    type: app-extension
    platform: macOS
    sources:
      - ShareExtension
      - App/AppIcon.icon
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleName: $(THOUGHTS_DISPLAY_NAME) Share
        CFBundleDisplayName: Add to $(THOUGHTS_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.4"
        ThoughtsAppGroup: $(THOUGHTS_APP_GROUP)
        ThoughtsURLScheme: $(THOUGHTS_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    entitlements:
      path: ShareExtension/ThoughtsShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(THOUGHTS_APP_GROUP)
    settings:
      base:
        PRODUCT_NAME: ThoughtsShare
        PRODUCT_MODULE_NAME: ThoughtsShare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(THOUGHTS_BUNDLE_ID).share
    dependencies:
      - package: ThoughtsCore
        product: ThoughtsCore
  ThoughtsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ThoughtsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hla.thoughts.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Thoughts
  ThoughtsCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
    settings:
      base:
        PRODUCT_NAME: thoughts
        PRODUCT_MODULE_NAME: ThoughtsCLI
        OTHER_CODE_SIGN_FLAGS: $(inherited) --identifier dev.hla.thoughts.cli
        ENTITLEMENTS_REQUIRED: NO
        SKIP_INSTALL: YES
    dependencies:
      - package: ThoughtsCore
        product: ThoughtsCommands
schemes:
  Thoughts:
    build:
      targets:
        Thoughts: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThoughtsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
